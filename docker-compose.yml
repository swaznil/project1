services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: projecthub
      POSTGRES_PASSWORD: projecthub
      POSTGRES_DB: projecthub
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - projecthub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecthub -d projecthub"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  projecthub_data:
